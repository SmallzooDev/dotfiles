# Fast starship config - optimized for tmux
# Reduces prompt delay by disabling slow modules

format = """$directory$git_branch$git_status$cmd_duration$status
$character"""

command_timeout = 100
palette = "coolnight"

[palettes.coolnight]
# coolnight palette (josean-dev)
bg = "#011423"
surface = "#214969"
gray = "#627E97"
text = "#CBE0F0"
red = "#E52E2E"
orange = "#FFE073"
yellow = "#FFE073"
green = "#44FFB1"
cyan = "#24EAF7"
blue = "#0FC5ED"
magenta = "#a277ff"
pink = "#a277ff"
# semantic aliases (so existing module styles keep working)
sapphire = "#0FC5ED"
mauve = "#a277ff"
teal = "#24EAF7"
sky = "#24EAF7"
peach = "#FFE073"
subtext1 = "#CBE0F0"
subtext0 = "#627E97"
overlay2 = "#627E97"
overlay1 = "#627E97"
overlay0 = "#627E97"
surface2 = "#214969"
surface1 = "#214969"
surface0 = "#214969"
base = "#011423"
mantle = "#011423"
crust = "#011423"

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[java]
disabled = true

[ruby]
disabled = true

[php]
disabled = true

[lua]
disabled = true

[package]
disabled = true

[git_status]
format = '[$conflicted$stashed$staged$modified$untracked$ahead_behind]($style) '
style = "red"
modified = " "
staged = " "
stashed = " "
conflicted = " "
untracked = "? "
ahead = " "
behind = " "
diverged = " "
ignore_submodules = true

[git_branch]
format = "[ $branch]($style) "
style = "sapphire"

[git_commit]
disabled = true

[git_state]
disabled = true

[git_metrics]
disabled = true

[directory]
format = "[ $path]($style) "
truncation_length = 3
style = "pink"
truncate_to_repo = true

[cmd_duration]
format = "[took $duration]($style) "
style = "overlay2"

[status]
disabled = false
format = "[exit $status]($style) "
style = "red"

[character]
success_symbol = "[❯](pink)"
error_symbol = "[❯](red)"
