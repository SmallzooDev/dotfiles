# STATUS BAR STYLE - GITHUB DARK
# palette: github dark default — bg #0d1117 fg #e6edf3 blue #58a6ff cyan #39c5cf purple #bc8cff gray #6e7681
set -g status-left '#{?client_prefix,#[fg=#bc8cff#,bg=default]#[fg=#0d1117#,bg=#bc8cff]  #S #[fg=#bc8cff#,bg=default],#[fg=#58a6ff#,bg=default]#[fg=#0d1117#,bg=#58a6ff]  #S #[fg=#58a6ff#,bg=default]}#[fg=#58a6ff,bg=default] |'
set -g status-right '#[fg=#58a6ff,bg=default]#[fg=#58a6ff,bg=default]| #[fg=#58a6ff,bg=default]#[fg=#0d1117,bg=#58a6ff]%m/%d/%y#[fg=#58a6ff,bg=default]'
set -g window-status-current-format '#[fg=#58a6ff,bg=default] #[fg=#0d1117,bg=#58a6ff]#I#W#[fg=#58a6ff,bg=default]'
set -g window-status-format '#[fg=#6e7681,bg=default]  #I #W '

set -g window-status-last-style 'fg=#e6edf3,bg=default'
set -g pane-border-style 'fg=#6e7681'
set -g pane-active-border-style 'fg=#58a6ff'
set -g message-command-style bg=default,fg=#e6edf3
set -g message-style bg=default,fg=#e6edf3
set -g mode-style bg=#6e7681,fg=#e6edf3
