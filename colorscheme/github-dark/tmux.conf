# STATUS BAR STYLE - GITHUB DARK
# palette: github dark default — bg #0d1117 fg #e6edf3 blue #58a6ff cyan #39c5cf purple #bc8cff gray #6e7681
set -g status-left '#{?client_prefix,#[fg=#bc8cff#,bg=default]#[fg=#0d1117#,bg=#bc8cff] #[fg=#e6edf3#,bg=#161b22] #S #[fg=#161b22#,bg=default],#[fg=#58a6ff#,bg=default]#[fg=#0d1117#,bg=#58a6ff] #[fg=#e6edf3#,bg=#161b22] #S #[fg=#161b22#,bg=default]} '
set -g status-right '#[fg=#bc8cff,bg=default]#[fg=#0d1117,bg=#bc8cff] #[fg=#e6edf3,bg=#161b22] #{b:pane_current_path} #[fg=#161b22,bg=default]'
set -g window-status-current-format '#[fg=#161b22,bg=default]#[fg=#e6edf3,bg=#161b22]#W#{?window_zoomed_flag,(),}#[fg=#58a6ff,bg=#161b22] █#[fg=#0d1117,bg=#58a6ff]#I#[fg=#58a6ff,bg=default]'
set -g window-status-format '#[fg=#161b22,bg=default]#[fg=#6e7681,bg=#161b22]#W#[fg=#6e7681,bg=#161b22] █#[fg=#0d1117,bg=#6e7681]#I#[fg=#6e7681,bg=default]'

set -g window-status-last-style 'fg=#e6edf3,bg=default'
set -g pane-border-style 'fg=#6e7681'
set -g pane-active-border-style 'fg=#58a6ff'
set -g message-command-style bg=default,fg=#e6edf3
set -g message-style bg=default,fg=#e6edf3
set -g mode-style bg=#6e7681,fg=#e6edf3
