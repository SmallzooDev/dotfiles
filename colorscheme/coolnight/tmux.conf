# STATUS BAR STYLE - COOLNIGHT
# palette: bg=#011423 surface=#214969 gray=#547998 fg=#CBE0F0 cyan=#24EAF7 magenta=#a277ff prefix=#a277ff
set -g status-left '#{?client_prefix,#[fg=#a277ff#,bg=default]#[fg=#011423#,bg=#a277ff] #[fg=#CBE0F0#,bg=#02203A] #S #[fg=#02203A#,bg=default],#[fg=#24EAF7#,bg=default]#[fg=#011423#,bg=#24EAF7] #[fg=#CBE0F0#,bg=#02203A] #S #[fg=#02203A#,bg=default]} '
set -g status-right '#[fg=#a277ff,bg=default]#[fg=#011423,bg=#a277ff] #[fg=#CBE0F0,bg=#02203A] #{b:pane_current_path} #[fg=#02203A,bg=default]'
set -g window-status-current-format '#[fg=#02203A,bg=default]#[fg=#CBE0F0,bg=#02203A]#W#{?window_zoomed_flag,(),}#[fg=#24EAF7,bg=#02203A] █#[fg=#011423,bg=#24EAF7]#I#[fg=#24EAF7,bg=default]'
set -g window-status-format '#[fg=#02203A,bg=default]#[fg=#547998,bg=#02203A]#W#[fg=#547998,bg=#02203A] █#[fg=#011423,bg=#547998]#I#[fg=#547998,bg=default]'

set -g window-status-last-style 'fg=#CBE0F0,bg=default'
set -g pane-border-style 'fg=#547998'
set -g pane-active-border-style 'fg=#24EAF7'
