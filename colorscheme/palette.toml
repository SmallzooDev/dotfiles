# Canonical colour palettes — single source of truth and backup for both themes.
# Each tool maps to these BY HAND (no generator — intentionally simple). A few
# per-tool secondary shades (e.g. nvim/tokyonight's blue1/blue5/blue6) are documented in
# colorscheme/README.md rather than forced into this table.
#
# coolnight   — terminal + nvim all use this vivid accent set.
# github-dark — GitHub Dark Default (projekt0n / primer primitives).
#
# Check tools against this file with:  colorscheme/bin/palette-check

[coolnight]
bg           = "#011423"  # terminal bg; popups; text drawn on an accent chip
bg_editor    = "#011628"  # nvim editor bg (transparent, rarely visible)
bg_highlight = "#143652"  # cursorline / hover
bg_visual    = "#275378"  # editor visual selection
bg_search    = "#0a64ac"
selection    = "#033259"  # terminal selection bg
surface      = "#214969"  # ANSI 0 / chrome surface
fg           = "#cbe0f0"
fg_dark      = "#b4d0e9"
gray         = "#547998"  # borders, inactive UI
overlay      = "#627e97"  # muted text, gutter numbers
comment      = "#7c91a8"
cursor       = "#47ff9c"
red          = "#e52e2e"
green        = "#44ffb1"
green_bright = "#47ff9c"
yellow       = "#ffe073"  # coolnight has no separate orange (orange = yellow)
orange       = "#ffe073"
blue         = "#0fc5ed"
cyan         = "#24eaf7"  # primary chrome accent
purple       = "#a277ff"

[github-dark]
bg           = "#0d1117"
bg_editor    = "#0d1117"  # nvim is transparent; editor bg = terminal bg
bg_highlight = "#182f50"  # nvim cursorline (hand-tuned blue)
bg_visual    = "#17335a"
bg_search    = "#1f6feb"
selection    = "#264f78"
surface      = "#21262d"  # subtle bg / hover
border       = "#30363d"  # panel borders / splits
fg           = "#e6edf3"
fg_dark      = "#b1bac4"
gray         = "#6e7681"  # borders, muted text, gutter
comment      = "#8b949e"
cursor       = "#2f81f7"
ansi_black   = "#484f58"
red          = "#ff7b72"
green        = "#3fb950"
green_bright = "#56d364"
yellow       = "#d29922"
orange       = "#f0883e"
blue         = "#58a6ff"  # primary accent: links, borders, cursorline number
cyan         = "#39c5cf"
purple       = "#bc8cff"
