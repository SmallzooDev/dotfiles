onboarding = false

[keys]
prefix = "ctrl+f"
settings = "prefix+shift+s"
reload_config = "prefix+r"
previous_tab = "prefix+p"
next_tab = "prefix+n"
copy_mode = ["prefix+enter", "alt+v"]
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = ""
navigate_pane_down = ""
navigate_pane_up = ""
navigate_pane_right = ""
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
zoom = "prefix+m"
resize_mode = "prefix+shift+r"
resize_pane_left = "prefix+h"
resize_pane_down = "prefix+j"
resize_pane_up = "prefix+k"
resize_pane_right = "prefix+l"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[ui.sidebar.agents]
rows = [
  ["state_icon", "agent", "state_text"],
  ["workspace", "tab"],
]

[theme]
name = "rose-pine"
auto_switch = false

[ui]
agent_panel_sort = "spaces"
